<div class="container mt-4">
  <h2 class="mb-4" style="color: #9fc3e2;">Historial de Pagos</h2>
  
  <div class="table-responsive shadow-sm rounded">
    <table class="table table-hover table-striped align-middle mb-0">
      <thead class="table-dark">
        <tr>
          <th>ID Transacción</th>
          <th>Fecha</th>
          <th>Patente</th>
          <th>RUT</th>
          <th>Monto</th>
          <th>Estado</th>
        </tr>
      </thead>
      <tbody>
        @for (pago of pagos; track pago.idTransaccion) {
          <tr>
            <td><span class="text-secondary fw-bold">{{ pago.idTransaccion }}</span></td>
            <td>{{ pago.fechaPago }}</td>
            <td class="text-uppercase">{{ pago.patente }}</td>
            <td>{{ pago.rutPropietario }}</td>
            <td class="text-success fw-bold">${{ pago.monto }}</td>
            <td><span class="badge bg-success">{{ pago.estado }}</span></td>
          </tr>
        } @empty {
          <tr>
            <td colspan="6" class="text-center py-4 text-muted">
              No hay registros de pagos en el sistema.
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
